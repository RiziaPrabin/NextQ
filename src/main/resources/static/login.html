<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NextQ — Staff Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body class="nextq-dark-page">

<div class="nextq-dark-shell">

    <!-- ================= HEADER ================= -->
    <header class="nextq-dark-header">

        <a href="/" class="nextq-dark-brand">

            <img
                src="nextq-logo.png"
                alt="NextQ logo"
                class="nextq-dark-logo"
            >

            <div class="nextq-dark-brand-text">

                <div class="nextq-dark-brand-name">
                    NextQ
                </div>

                <div class="nextq-dark-brand-tagline">
                    Know the queue. Plan your time.
                </div>

            </div>

        </a>

        <div class="nextq-dark-status">
            <span class="nextq-status-dot"></span>
            Staff access
        </div>

    </header>


    <!-- ================= MAIN ================= -->
    <main class="nextq-login-main">

        <section class="nextq-login-section">
            <a href="index.html" class="nextq-back-home">
    ← Back to Home
</a>
            <!-- LOGIN CARD -->
            <div class="nextq-login-card">

                <div class="nextq-login-logo">
                    <img
                        src="nextq-logo.png"
                        alt="NextQ"
                    >
                </div>

                <div class="nextq-login-heading">

                    <p class="nextq-eyebrow">
                        STAFF ACCESS
                    </p>

                    <h1>
                        Welcome back.
                    </h1>

                    <p>
                        Sign in to manage live queue information
                        and service activity.
                    </p>

                </div>


                <!-- LOGIN FORM -->
                <form id="loginForm">

                    <div class="nextq-form-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            id="username"
                            type="text"
                            placeholder="Enter username"
                            autocomplete="username"
                            required
                        >

                    </div>


                    <div class="nextq-form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            id="password"
                            type="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="nextq-login-button"
                    >
                        <span>Sign in</span>
                        <span class="button-arrow">→</span>
                    </button>


                    <div
                        id="loginMessage"
                        class="update-message hidden"
                    ></div>

                </form>

            </div>


            <!-- INFORMATION NOTE -->
            <div class="nextq-login-note">

                <div class="nextq-note-icon">
                    ✓
                </div>

                <p>
                    Authorized staff can update live queue information
                    and record completed services.
                </p>

            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->
    <footer class="nextq-dark-footer">

        <span>
            NextQ · Staff Portal
        </span>

        <span>
            Manage smarter. Serve better.
        </span>

    </footer>

</div>


<!-- ================= LOGIN SCRIPT ================= -->
<script>

const loginForm = document.getElementById("loginForm");

const usernameInput =
    document.getElementById("username");

const passwordInput =
    document.getElementById("password");

const loginMessage =
    document.getElementById("loginMessage");


loginForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    const username =
        usernameInput.value.trim();

    const password =
        passwordInput.value;


    // Basic validation
    if (!username || !password) {

        loginMessage.textContent =
            "Please enter your username and password.";

        loginMessage.className =
            "update-message error";

        return;
    }


    loginMessage.textContent =
        "Signing in...";

    loginMessage.className =
        "update-message";


    try {

        const response = await fetch(
            "/api/auth/login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    username: username,
                    password: password
                })
            }
        );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "Invalid username or password."
            );
        }


        // Store login state
        sessionStorage.setItem(
            "nextqStaffLoggedIn",
            "true"
        );


        loginMessage.textContent =
            result.message ||
            "Login successful.";

        loginMessage.className =
            "update-message success";


        // Redirect to staff dashboard
        setTimeout(() => {

            window.location.href =
                "/staff.html";

        }, 500);


    } catch (error) {

        console.error(error);

        loginMessage.textContent =
            error.message ||
            "Unable to sign in. Please try again.";

        loginMessage.className =
            "update-message error";

    }

});

</script>

</body>
</html>
